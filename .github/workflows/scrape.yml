name: Update jobs.json

on:
  schedule:
    - cron: "30 2 * * *"   # roz 08:00 IST (02:30 UTC)
  workflow_dispatch:        # Actions tab se haath se bhi chala sakte ho

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Check output
        run: |
          python - <<'PY'
          import json
          d = json.load(open("jobs.json", encoding="utf-8"))
          n = len(d["jobs"])
          print(n, "jobs")
          assert n > 0, "jobs.json khaali hai, commit nahi karunga"
          PY

      - name: Commit jobs.json
        run: |
          git config user.name "rudrapratap-art"
          git config user.email "rudrapratap532006@gmail.com"
          git add jobs.json llm_cache.json
          git diff --cached --quiet && echo "Koi badlav nahi" && exit 0
          git commit -m "Update jobs.json"
          git push
